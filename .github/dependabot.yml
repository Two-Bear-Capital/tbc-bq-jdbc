version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
    groups:
      maven-dependencies:
        patterns:
          - "*"
    # A wrapper bump regenerates mvnw.cmd and mvnwDebug.cmd with upstream's CRLF, and
    # Dependabot commits through the API, which skips the .gitattributes clean filter.
    # ci.yml's line-ending check then fails the whole group (#319, #329). Bump the
    # wrapper locally instead: ./mvnw wrapper:wrapper -Dmaven=<version>
    ignore:
      - dependency-name: "org.apache.maven:apache-maven"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      include: "scope"

  # The docs site (website/, Astro).
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    groups:
      website:
        patterns:
          - "*"
    commit-message:
      prefix: "chore"
      prefix-development: "chore"
      include: "scope"

  # The integration-test project's Terraform (terraform/, project bigquery-jdbc-driver-test).
  - package-ecosystem: "terraform"
    directory: "/terraform"
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
