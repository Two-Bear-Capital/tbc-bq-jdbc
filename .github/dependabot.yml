version: 2
updates:
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "timveil"
    reviewers:
      - "timveil"
    labels:
      - "dependencies"
    groups:
      maven-dependencies:
        patterns:
          - "*"
    # A wrapper bump regenerates mvnw.cmd and mvnwDebug.cmd with upstream's CRLF, and
    # Dependabot commits through the API, which skips the .gitattributes clean filter.
    # build.yml's line-ending check then fails the whole group (#319, #329). Bump the
    # wrapper locally instead: ./mvnw wrapper:wrapper -Dmaven=<version>
    ignore:
      - dependency-name: "org.apache.maven:apache-maven"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    assignees:
      - "timveil"
    reviewers:
      - "timveil"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      github-actions:
        patterns:
          - "*"
