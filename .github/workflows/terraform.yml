name: Terraform

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

# Prevent parallel applies — only one Terraform run at a time
concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest

    # Required for WIF authentication
    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      # Bootstrap: use long-lived SA key until WIF is fully provisioned.
      # Once WIF is active, switch to the google-github-actions/auth WIF block below.
      - name: Authenticate to Google Cloud (bootstrap SA key)
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_TERRAFORM_SA_KEY }}

      # Post-bootstrap: uncomment this block and remove the SA key block above
      # once WIF provider and service account are provisioned via Terraform.
      #
      # - name: Authenticate to Google Cloud (WIF)
      #   uses: google-github-actions/auth@v2
      #   with:
      #     workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
      #     service_account: ${{ secrets.WIF_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~1.6"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Resync Terraform State
        run: |
          terraform state rm google_project.integration 2>/dev/null || true
          terraform import google_project.integration projects/tbc-bq-jdbc-integration
        env:
          TF_VAR_org_id: ${{ secrets.GCP_ORG_ID }}
          TF_VAR_billing_account: ${{ secrets.GCP_BILLING_ACCOUNT }}
          TF_VAR_github_repo: Two-Bear-Capital/tbc-bq-jdbc

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_org_id: ${{ secrets.GCP_ORG_ID }}
          TF_VAR_billing_account: ${{ secrets.GCP_BILLING_ACCOUNT }}
          TF_VAR_github_repo: Two-Bear-Capital/tbc-bq-jdbc

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_org_id: ${{ secrets.GCP_ORG_ID }}
          TF_VAR_billing_account: ${{ secrets.GCP_BILLING_ACCOUNT }}
          TF_VAR_github_repo: Two-Bear-Capital/tbc-bq-jdbc
