name: Terraform

on:
  push:
    branches: [ main ]
    paths:
      - 'terraform/**'
      - '.github/workflows/terraform.yml'
  workflow_dispatch:

# Prevent parallel applies — only one Terraform run at a time
concurrency:
  group: terraform
  cancel-in-progress: false

jobs:
  terraform:
    name: Terraform Apply
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      id-token: write

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Bootstrap: use long-lived SA key until WIF is fully provisioned.
      # Once WIF is active, switch to the google-github-actions/auth WIF block below.
      - name: Authenticate to Google Cloud (bootstrap SA key)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          credentials_json: ${{ secrets.GCP_TERRAFORM_SA_KEY }}

      # Post-bootstrap: uncomment this block and remove the SA key block above
      # once WIF provider and service account are provisioned via Terraform.
      #
      # - name: Authenticate to Google Cloud (WIF)
      #   uses: google-github-actions/auth@v3
      #   with:
      #     workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
      #     service_account: ${{ secrets.WIF_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.6"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Resync Terraform State
        run: |
          terraform state rm google_project.integration 2>/dev/null || true
          terraform import google_project.integration projects/bigquery-jdbc-driver-test
        env:
          TF_VAR_org_id: ${{ secrets.GCP_ORG_ID }}
          TF_VAR_billing_account: ${{ secrets.GCP_BILLING_ACCOUNT }}
          TF_VAR_github_repo: Two-Bear-Capital/tbc-bq-jdbc

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        env:
          TF_VAR_org_id: ${{ secrets.GCP_ORG_ID }}
          TF_VAR_billing_account: ${{ secrets.GCP_BILLING_ACCOUNT }}
          TF_VAR_github_repo: Two-Bear-Capital/tbc-bq-jdbc

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        env:
          TF_VAR_org_id: ${{ secrets.GCP_ORG_ID }}
          TF_VAR_billing_account: ${{ secrets.GCP_BILLING_ACCOUNT }}
          TF_VAR_github_repo: Two-Bear-Capital/tbc-bq-jdbc

      - name: Export Terraform Outputs to GitHub Secrets
        run: |
          terraform output -raw wif_provider | gh secret set WIF_PROVIDER --repo $GITHUB_REPOSITORY
          terraform output -raw ci_service_account_email | gh secret set WIF_SERVICE_ACCOUNT --repo $GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ secrets.GH_ADMIN_TOKEN }}
