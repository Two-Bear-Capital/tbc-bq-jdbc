name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_run:
    workflows: [ "Terraform" ]
    branches: [ main ]
    types: [ completed ]

jobs:
  build:
    name: Build and Unit Tests
    runs-on: ubuntu-latest
    # Typical run is ~2 minutes. Without a limit a wedged Maven download inherits
    # GitHub's 6-hour default and burns runner time.
    timeout-minutes: 20
    if: github.event_name != 'workflow_run'
    permissions:
      contents: read
      code-quality: write  # Upload the coverage report to GitHub Code Quality

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # One pass: compile, unit tests, static analysis, package.
      # This was `./mvnw clean install` followed by `./mvnw test` and `./mvnw verify`,
      # which ran the unit suite three times over and packaged the shaded JARs
      # twice. Nothing downstream consumes the installed artifact — the docs
      # check runs off the test classpath and the real BigQuery job builds its
      # own — so `verify` is enough.
      #
      # spotless:check is bound to the verify phase, so this covers formatting
      # too; it used to run again as its own step. Javadoc is skipped on pull
      # requests — the release build generates it, and it is not worth ~15s on
      # every push — but still runs on main so a javadoc break cannot reach a
      # release unnoticed.
      - name: Build, unit tests and static analysis
        run: ./mvnw verify -B -Dmaven.javadoc.skip=${{ github.event_name == 'pull_request' }}

      # Coverage goes up here rather than at the end so a failure in the docs
      # check below cannot cost us the report. `verify` above already produced
      # target/site/jacoco/jacoco.xml, so this adds no build work — only a
      # format conversion, since the upload API takes Cobertura and JaCoCo
      # cannot write it.
      #
      # That report currently covers the unit tests only: jacoco's report goal
      # is bound to the `test` phase, which runs before failsafe, and failsafe
      # is never instrumented. So the published figure understates real
      # coverage — see #112. Fixing that needs no change here; the number just
      # goes up.
      - name: Convert JaCoCo report to Cobertura
        run: python3 scripts/jacoco-to-cobertura.py target/site/jacoco/jacoco.xml target/site/jacoco/cobertura.xml

      # The action no-ops on fork PRs (no code-quality:write token) and on merge
      # queue events, so it needs no `if:` guard of its own. fail-on-error is
      # false deliberately: coverage reporting is a nice-to-have, and an outage
      # in the upload API should not turn a green build red.
      - name: Upload coverage to GitHub Code Quality
        uses: actions/upload-code-coverage@v1
        with:
          file: target/site/jacoco/cobertura.xml
          language: Java
          label: code-coverage/jacoco
          fail-on-error: false

      # After the build, not before: this is a second Maven invocation, and running
      # it first made it pay the dependency resolution and compile that `verify`
      # then repeated — it was the single most expensive step in the job at ~41s.
      # Placed here it reuses the compiled classes and warm resolution.
      - name: Check generated docs are up to date
        run: ./mvnw test-compile exec:java -Pdocs -Dexec.args="--check" -B

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Upload integration test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-reports
          path: target/failsafe-reports/

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-reports
          path: target/site/jacoco/

  # Real BigQuery integration tests — run on push to main, same-repo PRs,
  # and manual dispatch. PRs from forks cannot access secrets (GitHub's
  # built-in protection), so fork PRs are excluded; the WIF attribute
  # condition additionally restricts authentication to this repository.
  real-integration-tests:
    name: Real BigQuery Integration Tests
    runs-on: ubuntu-latest
    # Typical run is ~1.5 minutes. This job talks to BigQuery over the network, so
    # it is the one that can actually hang: without a limit a stuck job poll would
    # hold a runner for GitHub's 6-hour default.
    timeout-minutes: 20
    # Deduplicate runs per branch: a new push supersedes the previous run of the
    # same ref. Isolation between concurrent PRs comes from RUN_ID-scoped table
    # and routine names, not from serializing here — a repo-wide group cancels
    # queued runs on OTHER pull requests, which reads as a failed required check
    # on a PR that did nothing wrong.
    concurrency:
      group: real-bigquery-tests-${{ github.ref }}
      cancel-in-progress: true
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # The real tests are gated by @EnabledIfEnvironmentVariable on BQ_TEST_PROJECT,
      # so a blank or missing secret does not fail — it silently disables every test
      # and the job reports success having verified nothing. Check before running.
      - name: Verify BigQuery test configuration is present
        run: |
          if [ -z "${BQ_TEST_PROJECT}" ]; then
            echo "::error::BQ_TEST_PROJECT is empty or unset. The real BigQuery tests would" \
                 "silently skip and this job would pass without testing anything."
            exit 1
          fi
          echo "BQ_TEST_PROJECT is set (${#BQ_TEST_PROJECT} chars)"
        env:
          BQ_TEST_PROJECT: ${{ secrets.BQ_TEST_PROJECT }}

      # One Maven invocation, integration tests only. `./mvnw clean install` followed
      # by `./mvnw verify` built the shaded JARs and javadoc twice and re-ran the
      # full unit suite that the Build job already covers — about 135s of the
      # job with nothing to show for it. Nothing here needs the packaged JARs.
      - name: Run real BigQuery integration tests
        run: ./mvnw test-compile failsafe:integration-test failsafe:verify -Preal-integration-tests -B
        env:
          BQ_TEST_PROJECT: ${{ secrets.BQ_TEST_PROJECT }}
          BQ_TEST_DATASET: ${{ secrets.BQ_TEST_DATASET }}

      # Second half of the same guard: the pre-flight check proves the secret is set,
      # this proves tests actually ran. Catches a broken include pattern or an
      # env-gate change that disables the suite without anything going red.
      - name: Verify the real suite actually ran tests
        run: |
          summary=target/failsafe-reports/failsafe-summary.xml
          if [ ! -f "$summary" ]; then
            echo "::error::$summary not found — failsafe did not run."
            exit 1
          fi
          completed=$(sed -n 's;.*<completed>\([0-9]*\)</completed>.*;\1;p' "$summary" | head -1)
          skipped=$(sed -n 's;.*<skipped>\([0-9]*\)</skipped>.*;\1;p' "$summary" | head -1)
          echo "Real BigQuery tests completed=${completed:-0} skipped=${skipped:-0}"
          if [ "${completed:-0}" -eq 0 ]; then
            echo "::error::The real BigQuery suite ran 0 tests. A green job here would be meaningless."
            exit 1
          fi

      - name: Upload real integration test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-integration-test-reports
          path: target/failsafe-reports/
