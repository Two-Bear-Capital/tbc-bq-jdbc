name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_run:
    workflows: [ "Terraform" ]
    branches: [ main ]
    types: [ completed ]

jobs:
  build:
    name: Build and Emulator Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Check code formatting
        run: mvn spotless:check

      - name: Build with Maven
        run: mvn clean install -B

      - name: Check generated docs are up to date
        run: mvn test-compile exec:java -Pdocs -Dexec.args="--check" -B

      - name: Run tests
        run: mvn test -B

      - name: Run integration tests
        run: mvn verify -Pintegration-tests -B

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Upload integration test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-reports
          path: target/failsafe-reports/

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-reports
          path: target/site/jacoco/

  # Real BigQuery integration tests — run on push to main, same-repo PRs,
  # and manual dispatch. PRs from forks cannot access secrets (GitHub's
  # built-in protection), so fork PRs are excluded; the WIF attribute
  # condition additionally restricts authentication to this repository.
  real-integration-tests:
    name: Real BigQuery Integration Tests
    runs-on: ubuntu-latest
    # Serialize real BigQuery runs across all PRs and pushes: they share one
    # dataset, so this is the backstop for any test that forgets to scope its
    # objects with RUN_ID. cancel-in-progress is false so a running suite is
    # never killed mid-flight; note that if two runs queue behind a third,
    # GitHub cancels the older queued one and that PR needs a re-run.
    concurrency:
      group: real-bigquery-tests
      cancel-in-progress: false
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven (skip tests)
        run: mvn clean install -DskipTests -B

      - name: Run real BigQuery integration tests
        run: mvn verify -Preal-integration-tests -B
        env:
          BQ_TEST_PROJECT: ${{ secrets.BQ_TEST_PROJECT }}
          BQ_TEST_DATASET: ${{ secrets.BQ_TEST_DATASET }}

      - name: Upload real integration test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-integration-test-reports
          path: target/failsafe-reports/
