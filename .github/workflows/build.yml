name: Build

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_run:
    workflows: [ "Terraform" ]
    branches: [ main ]
    types: [ completed ]

jobs:
  build:
    name: Build and Emulator Integration Tests
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_run'
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Fetch the emulator image while Maven compiles and runs the unit tests.
      # Testcontainers starts the container from a static initializer in the first
      # integration test class to load, so without this the pull lands on the
      # critical path — it is why SessionTest reports ~26s in CI and 2s locally.
      - name: Pre-fetch the BigQuery emulator image
        run: docker pull ghcr.io/recidiviz/bigquery-emulator:latest >/dev/null 2>&1 &

      - name: Check generated docs are up to date
        run: mvn test-compile exec:java -Pdocs -Dexec.args="--check" -B

      # One pass: compile, unit tests, then the emulator integration tests.
      # This was `mvn clean install` followed by `mvn test` and `mvn verify`,
      # which ran the unit suite three times over and packaged the shaded JARs
      # twice. Nothing downstream consumes the installed artifact — the docs
      # check runs off the test classpath and the real BigQuery job builds its
      # own — so `verify` is enough.
      #
      # spotless:check is bound to the verify phase, so this covers formatting
      # too; it used to run again as its own step. Javadoc is skipped on pull
      # requests — the release build generates it, and it is not worth ~15s on
      # every push — but still runs on main so a javadoc break cannot reach a
      # release unnoticed.
      - name: Build, unit tests and emulator integration tests
        run: mvn verify -Pintegration-tests -B -Dmaven.javadoc.skip=${{ github.event_name == 'pull_request' }}

      - name: Upload test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-reports
          path: target/surefire-reports/

      - name: Upload integration test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: integration-test-reports
          path: target/failsafe-reports/

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage-reports
          path: target/site/jacoco/

  # Real BigQuery integration tests — run on push to main, same-repo PRs,
  # and manual dispatch. PRs from forks cannot access secrets (GitHub's
  # built-in protection), so fork PRs are excluded; the WIF attribute
  # condition additionally restricts authentication to this repository.
  real-integration-tests:
    name: Real BigQuery Integration Tests
    runs-on: ubuntu-latest
    # Deduplicate runs per branch: a new push supersedes the previous run of the
    # same ref. Isolation between concurrent PRs comes from RUN_ID-scoped table
    # and routine names, not from serializing here — a repo-wide group cancels
    # queued runs on OTHER pull requests, which reads as a failed required check
    # on a PR that did nothing wrong.
    concurrency:
      group: real-bigquery-tests-${{ github.ref }}
      cancel-in-progress: true
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')

    permissions:
      contents: read
      id-token: write  # Required for Workload Identity Federation

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # One Maven invocation, integration tests only. `mvn clean install` followed
      # by `mvn verify` built the shaded JARs and javadoc twice and re-ran the
      # full unit suite that the Build job already covers — about 135s of the
      # job with nothing to show for it. Nothing here needs the packaged JARs.
      - name: Run real BigQuery integration tests
        run: mvn test-compile failsafe:integration-test failsafe:verify -Preal-integration-tests -B
        env:
          BQ_TEST_PROJECT: ${{ secrets.BQ_TEST_PROJECT }}
          BQ_TEST_DATASET: ${{ secrets.BQ_TEST_DATASET }}

      - name: Upload real integration test reports
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: real-integration-test-reports
          path: target/failsafe-reports/
