name: Dependabot Auto-Merge

# Enables auto-merge for Dependabot PRs that are patch or minor version bumps.
# Auto-merge only completes once the required status checks pass, per branch
# protection. Major version bumps are intentionally left for manual review.
#
# NOTE: We do not self-approve here. The enterprise policy "Allow GitHub Actions
# to create or approve pull requests" is disabled and cannot be overridden at the
# repo level, so branch protection on main requires 0 approving reviews and relies
# on the required status check as the merge gate.

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (patch & minor only)
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: |
          gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
