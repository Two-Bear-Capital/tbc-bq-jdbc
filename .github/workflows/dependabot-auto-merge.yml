# Dependabot auto-merge — CANONICAL, synced from tbc-platform-workspace.
#
# Source of truth: scripts/workflows/dependabot-auto-merge.yml in tbc-platform-workspace.
# DO NOT edit this file in-repo — change the workspace copy and run
# `make workflows ARGS="--apply"` to roll the update out everywhere. `make
# workflows` (no args) reports any repo whose copy has drifted from canonical.
#
# Behaviour: enable auto-merge (squash) for non-major Dependabot updates AND for
# every github-actions update regardless of semver (Action version bumps are
# SHA-pinned and CI-gated, so a breaking one fails CI and never merges — they're
# treated as ordinary auto-merge candidates). GitHub completes the merge only
# after required status checks pass — the CI checks the ci-gate ruleset enforces
# (`make rulesets`). A *non-actions* major update gets a comment and waits for
# a human.
#
# We do NOT approve the PR: no ruleset requires an approving review on any repo
# (see `make rulesets`), so an approval gates nothing — and GitHub
# Actions is not permitted to approve PRs under the org's default settings
# ("Allow GitHub Actions to create and approve pull requests" is off), so a
# `gh pr review --approve` step would fail and abort the job before auto-merge
# is ever enabled. Enabling auto-merge needs only `pull-requests: write`.
#
# A second, scheduled job (`rebase-stale`) sweeps daily for Dependabot PRs that
# rotted on a stale base — a failed `ci` bound to a head SHA nothing will touch
# again. It does NOT inspect auto-merge state. See the comment on that job for the
# exact selection criteria, why Dependabot does not self-heal this, and why the
# sweep cannot loop.
#
# Uses the default GITHUB_TOKEN: the permissions block below grants it write, so
# no personal access token (PAT) is needed.
name: Dependabot auto-merge

on:
  pull_request:
  schedule:
    - cron: "17 6 * * *" # daily un-stall sweep (see the rebase-stale job)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Auto-merge Dependabot PRs
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # only gh CLI calls
    steps:
      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge (non-major updates, or any github-actions update)
        if: steps.meta.outputs.update-type != 'version-update:semver-major' || steps.meta.outputs.package-ecosystem == 'github_actions'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on non-actions major updates (manual review)
        if: steps.meta.outputs.update-type == 'version-update:semver-major' && steps.meta.outputs.package-ecosystem != 'github_actions'
        run: >-
          gh pr comment "$PR_URL" --body
          "🚨 Major version update — review and merge manually (auto-merge skips non-actions majors)."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Un-stall Dependabot PRs that rotted on a stale base — a failed `ci` pinned to a
  # head SHA nothing will touch again. Selection is exactly: Dependabot-authored +
  # open + base behind the default branch + `ci` failed + not already nudged since
  # the current head. It does NOT check whether auto-merge is enabled — that's the
  # typical case, not a requirement; the rebase is worth requesting either way.
  # The why, the loop-safety argument, and the cases deliberately left alone are
  # documented in the script; this job is just the trigger and the token.
  rebase-stale:
    name: Rebase stale Dependabot PRs
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10 # only gh CLI calls
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Request a rebase on stale-base PRs with a failed ci
        run: bash .github/scripts/dependabot-rebase-stale.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
